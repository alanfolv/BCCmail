<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lixeira</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="img/bccmail_minimal.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <header class="header-container">
        <div class="header-left">
            <button id="menu-toggle" class="icon-btn" aria-label="Menu">
                <img src="img/menu-lateral.png" alt="Menu" class="menu-icon">
            </button>
            <a href="index.html"><img src="img/bccmail.png" alt="Logotipo do BCCMail" class="logo"></a>
        </div>
        <div class="header-center">
            <div class="search-bar">
                <i class="bi bi-search"></i>
                <input type="text" placeholder="Search mail">
                <i class="bi bi-sliders"></i>
            </div>
        </div>
        <div class="header-right">
            <label class="theme-switch" aria-label="Alternar Tema Escuro">
                <input type="checkbox" id="theme-toggle">
                <span class="slider"></span>
            </label>
            <div class="user-avatar"></div>
        </div>
    </header>

    <div class="main-layout">
        <nav class="sidebar" id="sidebar">
            <button class="compose-btn">
                <img src="img/compose.png" alt="icon compose" class="nav-icon">
                <span>Compose</span>
            </button>
            <ul class="nav-links">
                <li><a href="index.html"><img src="img/caixa-de-entrada.png" class="nav-icon"><span>Inbox</span></a></li>                        
                <li><a href="importantes.html"><img src="img/estrela.png" class="nav-icon"><span>Starred</span></a></li>
                <li><a href="enviados.html"><img src="img/enviados.png" class="nav-icon"><span>Sent</span></a></li>
                <li class="active"><a href="lixeira.php"><img src="img/lixo.png" class="nav-icon"><span>Trash</span></a></li>
            </ul>
        </nav>

        <main class="content-area">
            <div class="email-toolbar">
                <div class="toolbar-left"><input type="checkbox"><i class="bi bi-chevron-down"></i></div>
                <div class="toolbar-right"><span>Nenhuma mensagem na lixeira</span></div>
            </div>

            <div class="email-list-container" style="padding: 40px; text-align: center; color: var(--text-secondary);">
                <p>As mensagens que estiverem na lixeira há mais de 30 dias serão apagadas automaticamente.</p>
            </div>
        </main>
    </div>

    
    <div id="compose-modal" class="compose-modal" style="display: none;">
        <div class="compose-header"><span>New Message</span><button id="compose-close">✕</button></div>
        <div class="compose-body"><div class="compose-field"><input type="text" placeholder="Recipients"></div><div class="compose-field"><input type="text" placeholder="Subject"></div><div class="compose-textarea-container"><textarea placeholder="Body Text"></textarea></div></div>
        <div class="compose-footer"><button class="compose-send-btn">Send</button></div>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
