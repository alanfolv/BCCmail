<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caixa de Entrada - BCCmail</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/emails-dinamicos.css">
    <link rel="icon" href="/img/bccmail_minimal.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <header class="header-container">
        <div class="header-left">
            <button id="menu-toggle" class="icon-btn" type="button" aria-label="Abrir menu">
                <img src="/img/menu-lateral.png" alt="Menu" class="menu-icon">
            </button>
            <a href="/index" aria-label="BCCmail - Caixa de entrada">
                <img src="/img/bccmail.png" alt="Logotipo do BCCmail" class="logo">
            </a>
        </div>
        <div class="header-center">
            <div class="search-bar">
                <i class="bi bi-search" aria-hidden="true"></i>
                <input type="search" id="search-mail" placeholder="Pesquisar e-mails" aria-label="Pesquisar e-mails">
                <i class="bi bi-sliders" aria-hidden="true"></i>
            </div>
        </div>
        <div class="header-right">
            <label class="theme-switch" aria-label="Alternar tema escuro">
                <input type="checkbox" id="theme-toggle">
                <span class="slider"></span>
            </label>
            <i class="bi bi-question-circle" aria-hidden="true"></i>
            <i class="bi bi-gear" aria-hidden="true"></i>
            <i class="bi bi-grid-3x3-gap" aria-hidden="true"></i>
            <div class="user-avatar" aria-label="Perfil do usuário"></div>
        </div>
    </header>

    <div class="main-layout">
        <nav class="sidebar" id="sidebar" aria-label="Menu principal">
            <button class="compose-btn" type="button">
                <img src="/img/compose.png" alt="" class="nav-icon">
                <span>Escrever</span>
            </button>
            <ul class="nav-links">
                <li class="active"><a href="/"><img src="/img/caixa-de-entrada.png" alt="" class="nav-icon"><span>Caixa de entrada</span></a></li>
                <li><a href="/importantes"><img src="/img/estrela.png" alt="" class="nav-icon"><span>Com estrela</span></a></li>
                <li><a href="/enviados"><img src="/img/enviados.png" alt="" class="nav-icon"><span>Enviados</span></a></li>
                <li><a href="/lixeira"><img src="/img/lixo.png" alt="" class="nav-icon"><span>Lixeira</span></a></li>
            </ul>
        </nav>

        <main class="content-area">
            <section id="email-list-view" class="view-section" aria-label="Caixa de entrada">
                <div class="email-toolbar">
                    <div class="toolbar-left">
                        <input type="checkbox" aria-label="Selecionar todos os e-mails">
                        <i class="bi bi-chevron-down" aria-hidden="true"></i>
                        <button class="icon-btn" type="button" id="refresh-emails" title="Atualizar página" onclick="window.location.reload()">
                            <i class="bi bi-arrow-clockwise" aria-hidden="true"></i>
                        </button>
                    </div>
                    <div class="toolbar-right"><span>Caixa de entrada</span></div>
                </div>
                <div class="email-list-container" id="emails-container" data-email-list aria-live="polite">
                    <p class="empty-emails">Carregando e-mails...</p>
                </div>
            </section>

            <section id="email-detail-view" class="view-section" style="display:none" aria-label="Mensagem aberta">
                <div class="email-toolbar">
                    <div class="toolbar-left">
                        <button class="icon-btn" id="back-to-list" type="button" title="Voltar para a lista"><i class="bi bi-arrow-left"></i></button>
                    </div>
                </div>
                <article class="email-detail-container">
                    <h2 id="detail-subject" class="detail-subject">Assunto do e-mail</h2>
                    <div class="detail-header">
                        <div class="sender-info">
                            <div class="user-avatar-small"></div>
                            <div>
                                <strong id="detail-sender">Remetente</strong>
                                <div><span>Para: </span><span id="detail-receiver" class="sender-email"></span></div>
                            </div>
                        </div>
                        <div class="detail-time"><span id="detail-date"></span></div>
                    </div>
                    <div class="detail-body"><p id="detail-text"></p></div>
                </article>
            </section>
        </main>
    </div>

    <div id="compose-modal" class="compose-modal" style="display:none">
        <div class="compose-header">
            <span>Nova mensagem</span>
            <div class="compose-actions-top"><button id="compose-close" type="button" aria-label="Fechar">✕</button></div>
        </div>
        <form action="/enviaremail" method="POST" id="form-envio-email">
            <div class="compose-body">
                <div class="compose-field"><input type="email" name="destinatario" id="destinatario" placeholder="Destinatário" required></div>
                <div class="compose-field"><input type="text" name="assunto" id="assunto" placeholder="Assunto" required></div>
                <div class="compose-textarea-container"><textarea name="mensagem" id="mensagem" placeholder="Escreva sua mensagem..." required></textarea></div>
            </div>
            <div class="compose-footer"><button type="submit" class="compose-send-btn">Enviar</button></div>
        </form>
    </div>

    <script src="/js/main.js" defer></script>
</body>
</html>
