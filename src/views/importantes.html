<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Com Estrela</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="img/bccmail_minimal.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <header class="header-container">
        <div class="header-left">
            <button id="menu-toggle" class="icon-btn" aria-label="Menu">
                <img src="img/menu-lateral.png" alt="Menu" class="menu-icon">
            </button>
            <a href="index.html"><img src="img/bccmail.png" alt="Logotipo do BCCMail" class="logo"></a>
        </div>
        <div class="header-center">
            <div class="search-bar">
                <i class="bi bi-search"></i>
                <input type="text" placeholder="Search mail">
                <i class="bi bi-sliders"></i>
            </div>
        </div>
        <div class="header-right">
            <label class="theme-switch" aria-label="Alternar Tema Escuro">
                <input type="checkbox" id="theme-toggle">
                <span class="slider"></span>
            </label>
            <div class="user-avatar"></div>
        </div>
    </header>

    <div class="main-layout">
        <nav class="sidebar" id="sidebar">
            <button class="compose-btn">
                <img src="img/compose.png" alt="icon compose" class="nav-icon">
                <span>Compose</span>
            </button>
            <ul class="nav-links">
                <li><a href="index.html"><img src="img/caixa-de-entrada.png" class="nav-icon"><span>Inbox</span></a></li>                        
                <li class="active"><a href="importantes.php"><img src="img/estrela.png" class="nav-icon"><span>Starred</span></a></li>
                <li><a href="enviados.html"><img src="img/enviados.png" class="nav-icon"><span>Sent</span></a></li>
                <li><a href="lixeira.html"><img src="img/lixo.png" class="nav-icon"><span>Trash</span></a></li>
            </ul>
        </nav>

        <main class="content-area">
            <div id="email-list-view" class="view-section">
                <div class="email-toolbar">
                    <div class="toolbar-left">
                        <input type="checkbox" aria-label="Selecionar todos">
                        <i class="bi bi-chevron-down"></i>
                        <button class="icon-btn" title="Atualizar"><i class="bi bi-arrow-clockwise"></i></button>
                    </div>
                    <div class="toolbar-right">
                        <span>1-1 de 1</span>
                    </div>
                </div>

                <div class="email-list-container">
                    <table class="email-table">
                        <tbody>
                            <tr class="email-item read" onclick="openEmail('GitHub', 'GitHub Please reset your password', 'Reset your GitHub password configuration and security token verification.', '12:43')">
                                <td class="email-actions" onclick="event.stopPropagation()">
                                    <input type="checkbox" aria-label="Selecionar e-mail">
                                    <i class="bi bi-star-fill" style="color: #f4b400;"></i>
                                </td>
                                <td class="email-sender">GitHub</td>
                                <td class="email-subject-snippet">
                                    <span class="subject">GitHub Please reset your password</span>
                                    <span class="snippet">- Reset your GitHub password configuration...</span>
                                </td>
                                <td class="email-date">12:43</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

           
            <div id="email-detail-view" class="view-section" style="display: none;">
                <div class="email-toolbar">
                    <div class="toolbar-left">
                        <button class="icon-btn" id="back-to-list" title="Voltar"><i class="bi bi-arrow-left"></i></button>
                        <button class="icon-btn" title="Excluir"><i class="bi bi-trash"></i></button>
                        <button class="icon-btn" title="Marcar como não lida"><i class="bi bi-envelope"></i></button>
                    </div>
                    <div class="toolbar-right">
                        <span>1-1 de 1</span>
                    </div>
                </div>

                <div class="email-detail-container">
                    <h2 id="detail-subject" class="detail-subject">Assunto do E-mail</h2>
                    
                    <div class="detail-header">
                        <div class="sender-info">
                            <div class="user-avatar-small"></div>
                            <div>
                                <strong id="detail-sender">Remetente</strong> 
                                <span class="sender-email"><noreply@github.com></span>
                            </div>
                        </div>
                        <div class="detail-time">
                            <span id="detail-date">12:43</span>
                            <i class="bi bi-star-fill" style="color: #f4b400;"></i>
                            <i class="bi bi-reply"></i>
                            <i class="bi bi-three-dots-vertical"></i>
                        </div>
                    </div>

                    <div class="detail-body">
                        <p id="detail-text">Corpo da mensagem...</p>
                    </div>

                    <div class="detail-actions-footer">
                        <button class="action-chip">Looking forward to it!</button>
                        <button class="action-chip">We will be there!</button>
                        <button class="action-chip">Thanks for the update!</button>
                    </div>

                    <div class="reply-box-actions">
                        <button class="reply-btn"><i class="bi bi-reply"></i> Reply</button>
                        <button class="reply-btn"><i class="bi bi-arrow-right"></i> Forward</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    
    <div id="compose-modal" class="compose-modal" style="display: none;">
        <div class="compose-header"><span>New Message</span><button id="compose-close">✕</button></div>
        <div class="compose-body"><div class="compose-field"><input type="text" placeholder="Recipients"></div><div class="compose-field"><input type="text" placeholder="Subject"></div><div class="compose-textarea-container"><textarea placeholder="Body Text"></textarea></div></div>
        <div class="compose-footer"><button class="compose-send-btn">Send</button></div>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
