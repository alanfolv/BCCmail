<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fazer login</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="icon" href="../../img/bccmail_minimal.png" type="image/png" >
</head>
<body class="login-page">

    <!-- modo escuro/claro -->
    <div class="login-theme-wrapper">
        <label class="theme-switch" aria-label="Alternar Tema Escuro">
            <input type="checkbox" id="theme-toggle">
            <span class="slider"></span>
        </label>
    </div>

    <main class="login-container">
        <div class="login-card">
            <section class="login-intro">
                <img src="../../img/bccmail_minimal.png" alt="Logotipo do BCCmail" class="login-logo">
                <h1>Bem-vindo</h1>
                <p>Digite sua senha para continuar</p>
            </section>

            <section class="login-content">
                <form action="index.html" method="GET" class="login-form">
                    <input type="hidden" id="email" name="email">

                    <div class="input-group">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" autocomplete="current-password" required>
                        <div class="show-password">
                        <input type="checkbox" id="show-password">
                        <label for="show-password">Mostrar senha</label>
</div>
                    </div>

                    <a href="#" class="forgot-link">Esqueceu a senha?</a>

                    <div class="login-actions">
                        <a href="login.html" class="create-account-link">Voltar</a>
                        <button type="submit" class="btn-primary">Avançar</button>
                    </div>
                </form>
            </section>
        </div>
    </main>

    <script>
        const parametros = new URLSearchParams(window.location.search);
        document.getElementById("email").value = parametros.get("email") || "";
    </script>

    <script src="../../js/main.js"></script>
</body>
</html>
